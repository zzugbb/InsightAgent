name: release-gate

on:
  workflow_dispatch:
    inputs:
      release_gate_phase:
        description: "Release gate phase (auto/all/backend/frontend/tooling/hygiene)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - all
          - backend
          - frontend
          - tooling
          - hygiene
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "docs/development-runbook.md"
      - "compose.full.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "docs/development-runbook.md"
      - "compose.full.yml"

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_GATE_PHASE: ${{ github.event.inputs.release_gate_phase || 'auto' }}
  RELEASE_GATE_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Write release readiness matrix
        run: |
          bash scripts/ci_release_readiness_matrix.sh --format markdown --output /tmp/release-readiness.md
          bash scripts/ci_release_readiness_matrix.sh --format json --output /tmp/release-readiness.json
          cat /tmp/release-readiness.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run release gate
        run: |
          bash scripts/ci_run_release_gate.sh --phase "${RELEASE_GATE_PHASE}" \
            --repo-root "${{ github.workspace }}" \
            --event-name "${GITHUB_EVENT_NAME}" \
            --base-sha "${{ github.event.pull_request.base.sha || '' }}" \
            --head-sha "${{ github.sha }}" \
            --ref "${GITHUB_REF}" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --json-summary-file /tmp/release-gate-summary.json

      - name: Download previous release gate summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci_download_previous_release_gate_summary.sh \
            --workflow release-gate.yml \
            --branch "${RELEASE_GATE_SOURCE_BRANCH}" \
            --current-run-id "${GITHUB_RUN_ID}" \
            --output-file /tmp/previous-release-gate-summary.json \
            --summary-file /tmp/previous-release-gate-download-summary.md \
            --json-summary-file /tmp/previous-release-gate-download-summary.json
          cat /tmp/previous-release-gate-download-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Write release gate trend summary
        if: always()
        run: |
          previous_summary_args=()
          if [ -f /tmp/previous-release-gate-summary.json ]; then
            previous_summary_args=(--previous-json /tmp/previous-release-gate-summary.json)
          fi
          bash scripts/ci_release_gate_trend_summary.sh \
            --current-json /tmp/release-gate-summary.json \
            "${previous_summary_args[@]}" \
            --summary-file /tmp/release-gate-trend-summary.md \
            --json-summary-file /tmp/release-gate-trend-summary.json
          cat /tmp/release-gate-trend-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate operator summaries
        if: always()
        run: |
          if [ -f /tmp/release-gate-summary.json ]; then
            bash scripts/ci_assert_operator_summary_contract.sh \
              --summary-json /tmp/release-gate-summary.json \
              --summary-kind release_gate \
              --markdown "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f /tmp/release-gate-trend-summary.json ]; then
            bash scripts/ci_assert_operator_summary_contract.sh \
              --summary-json /tmp/release-gate-trend-summary.json \
              --summary-kind release_gate_trend \
              --markdown /tmp/release-gate-trend-summary.md
          fi

      - name: Upload release gate summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-summary
          path: /tmp/release-gate-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release gate trend summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-trend-summary
          path: |
            /tmp/previous-release-gate-summary.json
            /tmp/previous-release-gate-download-summary.md
            /tmp/previous-release-gate-download-summary.json
            /tmp/release-gate-trend-summary.md
            /tmp/release-gate-trend-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release readiness matrix
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-readiness-matrix
          path: |
            /tmp/release-readiness.md
            /tmp/release-readiness.json
          if-no-files-found: ignore
          retention-days: 14
